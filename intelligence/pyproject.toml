[project]
name = "cfds-intel"
version = "0.1.0"
description = "Capa de inteligencia de CFDsTrader: noticias, análogos históricos y modelos de ML."
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "nasdaq-100-ticker-history",
    "psycopg[binary]>=3.3.9",
    "pypdf>=6.9.2,<7",
    "redis>=6",
    "torch>=2.15.0",
    "truststore>=0.10.5",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfds_intel"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# torch avisa al importarse si no está NumPy; ML v1 no usa NumPy (#158).
filterwarnings = ["ignore:Failed to initialize NumPy:UserWarning"]

[tool.uv.sources]
nasdaq-100-ticker-history = { git = "https://github.com/jmccarrell/n100tickers", rev = "4ce85254b67f27540abedbb93a109687eafe39f0" }
# PyTorch (ML v1, #158): en Linux (CI) el wheel de CPU, sin CUDA (unos 200 MB en vez de varios
# GB). En macOS (el Mac mini) el de PyPI, que ya es de CPU/MPS.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
# La fuente de componentes del NASDAQ 100 no publica tipos; se envuelve en cfds_intel.universe.
module = ["nasdaq_100_ticker_history", "nasdaq_100_ticker_history.*"]
ignore_missing_imports = true
