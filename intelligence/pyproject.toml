[project]
name = "cfds-intel"
version = "0.1.0"
description = "Capa de inteligencia de CFDsTrader: noticias, análogos históricos y modelos de ML."
requires-python = ">=3.13"
dependencies = [
    "nasdaq-100-ticker-history",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfds_intel"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
nasdaq-100-ticker-history = { git = "https://github.com/jmccarrell/n100tickers", rev = "4ce85254b67f27540abedbb93a109687eafe39f0" }

[[tool.mypy.overrides]]
# La fuente de componentes del NASDAQ 100 no publica tipos; se envuelve en cfds_intel.universe.
module = ["nasdaq_100_ticker_history", "nasdaq_100_ticker_history.*"]
ignore_missing_imports = true
