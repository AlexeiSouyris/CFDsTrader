# Modelo de ML v1 (docs/spec/ml-v1.md, #158, aprobada por el dueño el 23-11-2026). Lo lee Python
# (`cfds_intel.models`) y se valida al cargar. Los cortes de tiempo salen de config/data_split.toml
# y el embargo, de backtest.toml (exits.time_exit_bars): no se repiten acá.

[dataset]
# Decisión 4 de la spec §11: se empieza solo con US500. Sumar otros pide otra aprobación.
instruments = ["US500"]

[features]
# Variables que arma el motor (Rust) para `ml_features.v1` (spec §3). Tercios de la volatilidad
# realizada diaria frente a su propia historia de estos años (la misma definición que el contexto
# de los análogos, spec §13: config/analogs.toml `vol_history_years`).
vol_history_years = 3

[training]
# Mínimo por ventana de entrenamiento (spec §6, decisión 3): con menos, la ventana no entrena.
min_examples = 300
min_per_class = 50
# Corte interno para elegir hiperparámetros (spec §5): el último 20 % del entrenamiento.
inner_tune_fraction = "0.2"
# Fuerza de la penalización L2 de M1: se elige la de menor log loss en el corte interno.
l2_grid = ["0.0001", "0.001", "0.01", "0.1", "1"]
# M1 se ajusta con L-BFGS en lote completo, en float64: determinista con la misma semilla.
max_iterations = 200
seed = 42

[evaluation]
# Regla de "mejora" (spec §6, fijada antes de mirar): M1 mejora a B1 si su log loss es menor y el
# intervalo de la diferencia queda entero por debajo de 0. Bootstrap por bloques de una semana
# (ISO, en UTC) sobre todas las validaciones juntas.
bootstrap_resamples = 1000
confidence = "0.95"

[interval]
# Intervalo de cada predicción (spec §6): percentiles de las predicciones de N modelos M1
# entrenados con remuestreos bootstrap del entrenamiento (por bloques de una semana, como arriba).
# Con menos casos parecidos que min_cases de config/probability.toml: "datos insuficientes".
models = 200
low_percentile = 5
high_percentile = 95
