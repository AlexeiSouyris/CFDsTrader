answer = "b"

[[lessons.questions]]
id = "12.1.5"
kind = "choice"
prompt = "¿Qué hace el simulador con la caída que sigue al máximo intradía?"
options = [
  { id = "a", text = "La aproxima con el cierre de cada operación." },
  { id = "b", text = "No la simula (hace falta el capital vela por vela): la deja afuera y avisa que la probabilidad de pasar es un tope superior." },
  { id = "c", text = "La trata como una caída fija." },
  { id = "d", text = "Rechaza el pedido." },
]
answer = "b"

[[lessons.questions]]
id = "12.1.6"
kind = "choice"
prompt = "¿Por qué el simulador trae solo una plantilla genérica en blanco?"
options = [
  { id = "a", text = "Porque las firmas no tienen reglas." },
  { id = "b", text = "Porque no se inventan reglas de firmas reales: cargar una necesita su reglamento publicado, con el enlace y la fecha de lectura." },
  { id = "c", text = "Porque todas las firmas tienen las mismas reglas." },
  { id = "d", text = "Porque la UI calcula las reglas." },
]
answer = "b"

[[lessons]]
id = "12.2"
title = "Quién gana con el negocio"
objective = "Calcular el valor esperado de un programa de fondeo con las fórmulas del motor: cuánto se paga en cuotas hasta cobrar, cuánto se cobra y qué cobro medio hace falta para no perder."
doc = "docs/academia/nivel-12-2-quien-gana.md"
exam = "quiz"
unlocks = []

[[lessons.questions]]
id = "12.2.1"
kind = "number"
prompt = "La probabilidad de cobrar en un intento es q = 10 %. ¿Qué probabilidad hay de cobrar en 5 intentos o menos, en %? (un decimal)"
answer = "41.0"
tolerance = "0.1"
unit = "%"

[[lessons.questions]]
id = "12.2.2"
kind = "number"
prompt = "Con q = 10 % y como mucho 5 intentos, ¿cuántos intentos esperados se pagan? (dos decimales)"
answer = "4.10"
tolerance = "0.01"

[[lessons.questions]]
id = "12.2.3"
kind = "number"
prompt = "q = 10 %, 5 intentos como mucho, cuota 100, sin activación ni devolución, cobro medio 800. ¿Cuál es el valor esperado del programa? (dos decimales)"
answer = "-81.90"
tolerance = "0.1"

[[lessons.questions]]
id = "12.2.4"
kind = "number"
prompt = "Sin activación ni devolución, cuota 200 y q = 8 %. ¿Qué cobro medio hace falta, como mínimo, para que el valor esperado no sea negativo?"
answer = "2500"
tolerance = "1"

[[lessons.questions]]
id = "12.2.5"
kind = "number"
prompt = "Evaluación 100, activación 150 (se paga al pasar) y P(pasar la evaluación) = 20 %. ¿Cuánto cuesta, en promedio, cada intento?"
answer = "130"
