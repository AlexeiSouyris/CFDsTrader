# herramienta en la app (solo existe dentro de la prueba H4.3) y queda pendiente; la GEX no se
# puede medir sin datos de opciones.
[[tools]]
id = "tool.imbalance"
name = "Índice de desequilibrio aproximado (Liquidez)"

# Nivel 12 (#847). El simulador de cuentas fondeadas del Laboratorio (cfds-propsim, #802, #803,
# #807): reglas de una evaluación, probabilidad de cobrar o fallar, valor esperado después de
# cuotas y comparación con operar al azar. Vive en la misma vista que el constructor
# (tool.lab_builder) y el simulador de varianza: su candado envuelve solo este simulador.
[[tools]]
id = "tool.propsim"
name = "Simulador de cuentas fondeadas (Laboratorio)"

