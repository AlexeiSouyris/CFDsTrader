[[lessons.questions]]
id = "12.2.6"
kind = "number"
prompt = "Topstep publicó que en 2025 se aprobó el 16,8 % de sus evaluaciones. ¿Qué % de las cuotas de evaluación fue de intentos que no pasaron? (un decimal)"
answer = "83.2"
tolerance = "0.1"
unit = "%"

[[lessons]]
id = "12.3"
title = "La evidencia honesta y los conflictos de interés"
objective = "Separar lo auditado de lo autodeclarado, conocer los pocos números públicos sobre cuentas fondeadas y la evidencia académica sobre traders intradía, y reconocer un conflicto de interés."
doc = "docs/academia/nivel-12-3-evidencia-honesta.md"
exam = "quiz"
unlocks = []

[[lessons.questions]]
id = "12.3.1"
kind = "choice"
prompt = "¿Qué nivel de prueba tienen las tasas de aprobación que publica una firma de fondeo?"
options = [
  { id = "a", text = "A: son datos oficiales auditados." },
  { id = "b", text = "C: son autodeclaradas, sin auditoría, y la firma gana con las cuotas." },
  { id = "c", text = "B: son un libro con método." },
  { id = "d", text = "No tienen ningún valor." },
]
answer = "b"

[[lessons.questions]]
id = "12.3.2"
kind = "choice"
prompt = "Topstep publicó para 2025 que se aprobó el 16,8 % de las evaluaciones y que el 51,8 % de las personas aprobó al menos una. ¿Por qué son tan distintos?"
options = [
  { id = "a", text = "Porque uno es de 2024 y el otro de 2025." },
  { id = "b", text = "Porque uno cuenta intentos y el otro personas: muchas personas compran varios intentos." },
  { id = "c", text = "Porque uno es con dinero real y el otro no." },
  { id = "d", text = "Es un error de la firma." },
]
answer = "b"

[[lessons.questions]]
id = "12.3.3"
kind = "choice"
prompt = "Topstep publicó que el 0,71 % de las personas con cuenta Express Funded fue llamada a una cuenta real en 2025. ¿Qué te dice?"
options = [
  { id = "a", text = "Que casi todos los que pasan operan con dinero real." },
  { id = "b", text = "Que la cuenta Express Funded (donde se opera en mercados simulados) casi nunca llega a una cuenta real: menos de 1 de cada 100." },
  { id = "c", text = "Que el 99 % cobró." },
  { id = "d", text = "Que la firma pierde dinero." },
]
answer = "b"

[[lessons.questions]]
id = "12.3.4"
kind = "choice"
prompt = "¿Qué encontraron Barber, Lee, Liu y Odean (2014) con los day traders de Taiwán (1992–2006)?"
options = [
  { id = "a", text = "Que la mayoría gana después de comisiones." },
  { id = "b", text = "Que menos del 1 % logra retornos anormales positivos de forma predecible y confiable después de comisiones." },
  { id = "c", text = "Que con práctica todos mejoran." },
  { id = "d", text = "Que las comisiones no importan." },
]
answer = "b"

[[lessons.questions]]
id = "12.3.5"
kind = "choice"
prompt = "En Brasil (Chague, De-Losso y Giovannetti), de quienes hicieron day trading en minicontratos del índice más de 300 días, ¿qué pasó?"
options = [
  { id = "a", text = "El 97 % perdió dinero y no encontraron evidencia de que aprendieran con el tiempo." },
  { id = "b", text = "La mitad vivió del trading." },
  { id = "c", text = "Los que más operaron mejoraron mucho." },
  { id = "d", text = "No hay datos." },
]
answer = "a"

[[lessons.questions]]
id = "12.3.6"
kind = "choice"
prompt = "Un trader conocido recomienda una firma y da un código de descuento («Use code 'GB'»). ¿Qué conclusión es correcta?"
options = [
  { id = "a", text = "Si da un descuento, la firma es buena." },
  { id = "b", text = "Es un conflicto de interés probable: gana más si más gente compra desafíos. No prueba que mienta, pero obliga a pedir evidencia verificable, con los fracasos incluidos." },
  { id = "c", text = "Está mintiendo." },
  { id = "d", text = "No importa quién lo dice." },
]
answer = "b"

[[lessons]]
id = "12.4"
title = "Pasar por suerte: el simulador"
objective = "Usar el simulador para ver con qué probabilidad unas operaciones cobran, queman la cuenta o se quedan sin tiempo, cuánto valen después de las cuotas y si le ganan a operar al azar, y llegar a la conclusión honesta."
doc = "docs/academia/nivel-12-4-pasar-por-suerte.md"
exam = "quiz"
unlocks = ["tool.propsim"]

[[lessons.questions]]
id = "12.4.1"
kind = "number"
prompt = "Operaciones con esperanza 0 y ganancias y pérdidas del mismo tamaño, sin costos, sin pérdida diaria ni límite de días. Objetivo 6 % y caída máxima fija 9 %. ¿Probabilidad aproximada de pasar, en %?"
answer = "60"
tolerance = "1"
unit = "%"

[[lessons.questions]]
id = "12.4.2"
kind = "choice"
prompt = "Pasaste una evaluación con 12 operaciones. ¿Qué prueba eso sobre tu método?"
options = [
  { id = "a", text = "Que tenés ventaja." },
  { id = "b", text = "Casi nada: con esperanza 0 también se pasa seguido; juzgar el método por ese resultado es resulting." },
  { id = "c", text = "Que vas a cobrar." },
  { id = "d", text = "Que la firma es fácil." },
]
answer = "b"

[[lessons.questions]]
id = "12.4.3"
kind = "choice"
prompt = "El simulador dice: tus operaciones cobran en el 18 % de los intentos (14–22 %); operando al azar, en el 15 % (12–19 %). ¿Qué concluís?"
options = [
  { id = "a", text = "Le ganás al azar por 3 puntos." },
  { id = "b", text = "No se distingue del azar: los intervalos se tocan y la diferencia puede ser suerte." },
  { id = "c", text = "Perdés contra el azar." },
  { id = "d", text = "Que el simulador está mal." },
]
answer = "b"

[[lessons.questions]]
id = "12.4.4"
kind = "choice"
prompt = "¿Por qué unas operaciones sin ventaja verificada no tienen esperanza 0 sino negativa?"
options = [
  { id = "a", text = "Porque los costos (spread, comisión, slippage, financiación) se pagan siempre: sin ventaja bruta, lo neto queda abajo de cero." },
  { id = "b", text = "Porque el mercado está en contra del trader." },
  { id = "c", text = "Sí tienen esperanza 0." },
  { id = "d", text = "Porque las firmas cobran comisión por operación." },
]
answer = "a"

[[lessons.questions]]
id = "12.4.5"
kind = "choice"
prompt = "Con unas reglas, el simulador da valor esperado positivo operando al azar (esperanza 0). ¿Qué hacés primero?"
options = [
  { id = "a", text = "Comprar muchos desafíos." },
  { id = "b", text = "Atacar los supuestos: el cobro medio, la regla intradía que no se simula, que la firma pague y no cambie sus reglas, que la cuenta sea simulada, y que tus operaciones reales pagan costos." },
  { id = "c", text = "Nada: el simulador no se equivoca." },
  { id = "d", text = "Subir el riesgo por operación." },
]
answer = "b"

[[lessons.questions]]
id = "12.4.6"
kind = "choice"
prompt = "¿Cuál es la conclusión honesta del nivel 12?"
options = [
  { id = "a", text = "Las cuentas fondeadas son una manera segura de ganar." },
  { id = "b", text = "Sin una ventaja verificada después de costos, lo esperable es un valor esperado negativo: se pagan cuotas en cada intento y se pasa menos que con esperanza 0." },
  { id = "c", text = "Con suficientes intentos siempre se cobra más de lo que se paga." },
  { id = "d", text = "Conviene la firma con la cuota más barata." },
]
answer = "b"
