[[lessons]]
id = "0.1"
title = "Qué es un mercado"
objective = "Entender que del otro lado hay alguien, y que el precio es el último acuerdo."
doc = "docs/academia/nivel-00-1-que-es-un-mercado.md"
exam = "quiz"
unlocks = ["tool.watchlist", "tool.instrument_panel"]

[[lessons.questions]]
id = "0.1.1"
kind = "choice"
prompt = "¿Qué es el «último precio» de un instrumento?"
options = [
  { id = "a", text = "El precio del último acuerdo entre alguien que compró y alguien que vendió." },
  { id = "b", text = "El precio que va a tener mañana." },
  { id = "c", text = "Un precio que fija el gobierno cada día." },
  { id = "d", text = "El promedio de todos los precios del día." },
]
answer = "a"

[[lessons.questions]]
id = "0.1.2"
kind = "choice"
prompt = "¿Qué hace falta para que haya una operación?"
options = [
  { id = "a", text = "Solo alguien que quiera comprar." },
  { id = "b", text = "Alguien que compra y alguien que vende, de acuerdo en el mismo precio." },
  { id = "c", text = "Que el precio esté subiendo." },
  { id = "d", text = "Que el regulador la apruebe." },
]
answer = "b"

[[lessons.questions]]
id = "0.1.3"
kind = "choice"
prompt = "Cuando abrís un CFD del US 500 en IG, ¿con quién es el contrato?"
options = [
  { id = "a", text = "Con la bolsa de Nueva York." },
  { id = "b", text = "Con las 500 empresas del índice." },
  { id = "c", text = "Con el broker (IG), que es el proveedor del CFD." },
  { id = "d", text = "Con otro cliente elegido al azar." },
]
answer = "c"

