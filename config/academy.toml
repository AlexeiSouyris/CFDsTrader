# Catálogo de la Academia (docs/design/2026-11-academia.md §3 y §4, #709, #717).
# Lo lee y lo valida al arrancar el motor (crate cfds-academy); la UI lo recibe sin las claves en
# academy_catalog.v1 (GET /api/v1/academy/catalog). Nada de esto toca el motor de trading, el
# riesgo ni el paper: solo qué se enseña, cómo se corrige y qué se ve en la UI.
#
# Por ahora, niveles 0 a 5, con su contenido (#760 y #819, §8 PR 6 y 11): el texto de cada lección
# está en `doc` (docs/academia/*.md, formato que valida cfds_academy::lesson_doc: secciones fijas, aviso,
# sin promesas y una tabla de cifras que el motor compara con su fuente del repo). Mientras una
# lección con examen no tenga preguntas, su examen sale `ready = false` y no se puede rendir (sus
# herramientas se abren solo a mano, en Ajustes).
#
# Las preguntas dicen en su texto los números que usan (spread, tasa, tope...): si la config de
# instrumentos o de riesgo cambia, falla el test de la lección (su tabla de cifras) y hay que
# revisar también sus preguntas. Los precios redondos (6.000, 25.000, 24.000) son de ejemplo, no
# cotizaciones. Educativo: nada de esto es consejo de inversión ni promete ganancias.
#
# Formato de las preguntas, dentro de la lección:
#   [[lessons.questions]]
#   id = "2.2.1"             # <lección>.<n>
#   kind = "choice"          # choice | number
#   prompt = "..."
#   options = [{ id = "a", text = "..." }, { id = "b", text = "..." }]
#   answer = "a"             # choice: id de la opción. number: string decimal
#   # tolerance = "0.01"     # solo number: |respuesta − clave| <= tolerancia
#   # unit = "pts"           # solo number, opcional
#
# Examen de replay (#759): `exam = "replay"` con `replay_kind = "levels"` (marcar niveles),
# `"pivots"` (marcar pivotes confirmados, #800) o `"trades"` (operar con proceso), sin preguntas. Lo califica el motor al terminar la sesión
# (exam_result.v1) y el intento queda guardado como evento; la lección se aprueba con el proceso
# aprobado. Lo usan 4.1 (pivots) y 4.2 (levels).

[thresholds]
# PROVISORIOS (propuesta del diseño, §10.3 y §10.5): son parámetros EDUCATIVOS, no de trading, y
# el dueño los puede cambiar cuando quiera; hasta que los apruebe, la UI los muestra como
# provisorios (`provisional = true`).
# Porcentaje de respuestas correctas para aprobar un examen de preguntas.
quiz_pass_pct = "80"
# true: una herramienta bloqueada se ve gris con un candado y dice qué lección la abre.
locked_tools_visible = true
provisional = true

[replay]
# Exámenes con replay (§5 del diseño, #721): velas reales guardadas, instrumento, timeframe y fecha
# al azar con una semilla, SOLO dentro del período de investigación (nunca los meses fuera de
# muestra de config/data_split.toml). La fecha real no viaja hasta el final.
# PROVISORIOS (propuesta del diseño, §10.3 y §10.4): parámetros EDUCATIVOS, no de trading; el dueño
# los puede cambiar cuando quiera.
# Instrumentos del catálogo con velas de futuros guardadas: ES, NQ e YM desde 2011; FDAX solo desde
# 03-2025 (su período de investigación es corto). Los costos son los del CFD de
# config/instruments.toml.
instruments = ["US500", "US100", "US30", "DE40"]
timeframes = ["15m", "1h"]
# Velas: hoy solo las de los futuros (futures_candles de `futures_source`); las del CFD de IG casi
# no tienen historia antes del fuera de muestra.
source = "futures"
futures_source = "databento"
# Velas de calentamiento que se ven antes de empezar.
warmup_bars = 300
# Velas del examen después del calentamiento (niveles y operaciones), y de una práctica libre.
exam_bars = 400
practice_bars = 200
# Operaciones mínimas de un examen de operaciones, para que una sola no decida.
trades_per_exam = 10
# Pivotes marcados como mínimo en un examen de pivotes (#800; «marcar 5 pivotes», lección 4.1 del
# temario). Aprueba con esa cantidad y la precisión >= quiz_pass_pct.
pivots_per_exam = 5
# Tolerancia de los niveles marcados contra los del motor, en múltiplos del ATR al cursor.
level_tolerance_atr = "0.25"
# Mover el precio para que no se reconozca el año: no (cambia los números redondos). Solo false.
shift_prices = false
# Velas por paso como máximo, sesiones abiertas a la vez en memoria del gateway (la más vieja se
# cierra) y sorteos de fecha antes de rendirse (días sin velas, feriados).
max_step_bars = 100
max_sessions = 8
max_draws = 20

