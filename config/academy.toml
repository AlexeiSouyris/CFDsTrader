[[lessons.questions]]
id = "2.3.1"
kind = "number"
prompt = "El motor supone un slippage por ejecución de 0,1 × spread + 1 tick. En US500 (spread 0,9; tick 0,01), ¿cuántos puntos es?"
answer = "0.1"
tolerance = "0"
unit = "pts"

[[lessons.questions]]
id = "2.3.2"
kind = "number"
prompt = "Con la misma regla, en US100 (spread 1,6; tick 0,1), ¿cuántos puntos de slippage por ejecución?"
answer = "0.26"
tolerance = "0"
unit = "pts"

[[lessons.questions]]
id = "2.3.3"
kind = "number"
prompt = "Costo de ida y vuelta en US500 = spread + slippage de 2 ejecuciones (0,1 cada una). ¿Cuántos puntos da?"
answer = "1.1"
tolerance = "0"
unit = "pts"

[[lessons.questions]]
id = "2.3.4"
kind = "number"
prompt = "CFD de una acción de EE. UU.: 0,02 USD por acción con un mínimo de 15 USD por ejecución. Comprás 100 acciones: ¿cuánto pagás de comisión al abrir, en USD?"
answer = "15"
tolerance = "0"
unit = "USD"

[[lessons.questions]]
id = "2.3.5"
kind = "number"
prompt = "La misma comisión (0,02 USD por acción, mínimo 15 USD) con 2.000 acciones: ¿cuánto pagás al abrir, en USD?"
answer = "40"
tolerance = "0"
unit = "USD"

[[lessons.questions]]
id = "2.3.6"
kind = "choice"
prompt = "Una señal aparece al cierre de la vela t. ¿Cuándo se ejecuta en el backtest y en el paper?"
options = [
  { id = "a", text = "Al cierre de la misma vela t." },
  { id = "b", text = "En la apertura de la vela siguiente, t+1." },
  { id = "c", text = "En el mínimo de la vela t." },
]
answer = "b"

[[lessons.questions]]
id = "2.3.7"
kind = "choice"
prompt = "Tenés un stop en 26.600. El viernes cierra en 26.750 y el lunes abre en 26.400. ¿Dónde se ejecuta el stop?"
options = [
  { id = "a", text = "En 26.600, siempre." },
  { id = "b", text = "Cerca de 26.400: con un gap no hubo precios en el medio." },
  { id = "c", text = "No se ejecuta." },
]
answer = "b"

[[lessons]]
id = "2.4"
title = "Caso real: los costos mataron la estrategia"
objective = "Leer un resultado propio antes de costos, con costos y neto."
doc = "docs/academia/nivel-02-4-caso-real-costos.md"
exam = "quiz"
unlocks = ["tool.cost_calculator"]

[[lessons.questions]]
id = "2.4.1"
kind = "choice"
prompt = "Estrategia en uso, US500, 2011–2025 (R001): −0,02 R por operación antes de costos y 0,18 R de costos. ¿De dónde sale casi toda la pérdida?"
options = [
  { id = "a", text = "De los costos." },
  { id = "b", text = "De las señales, que antes de costos pierden mucho." },
  { id = "c", text = "De la financiación nocturna sola." },
]
answer = "a"

[[lessons.questions]]
id = "2.4.2"
kind = "number"
prompt = "En R001 (US500) los costos sumaron 56.162 € y el spread 43.528 €. ¿Qué porcentaje de los costos fue el spread? (redondeá a un decimal)"
answer = "77.5"
tolerance = "0.5"
unit = "%"

[[lessons.questions]]
id = "2.4.3"
kind = "choice"
prompt = "Momentum de la última media hora (R017 y R026): la cartera dio un t de −11. ¿De dónde venía?"
options = [
  { id = "a", text = "De un efecto de mercado muy fuerte en contra." },
  { id = "b", text = "Del costo casi fijo de cada operación: antes de costos estaba cerca de cero." },
  { id = "c", text = "De un error en los datos." },
]
answer = "b"

[[lessons.questions]]
id = "2.4.4"
kind = "choice"
prompt = "Deriva nocturna de 02:00 a 03:00 de Nueva York (R021): el efecto existe en nuestros datos, pero..."
options = [
  { id = "a", text = "El costo del CFD a esa hora es de 2 a 4 veces más grande que el efecto." },
  { id = "b", text = "Solo funciona los lunes." },
  { id = "c", text = "Es tan grande que cualquier costo se paga solo." },
]
answer = "a"

[[lessons.questions]]
id = "2.4.5"
kind = "number"
prompt = "Una estrategia da 0 R por operación antes de costos y paga 0,10 R de costo por operación. ¿Cuál es el resultado total de 100 operaciones, en R?"
answer = "-10"
tolerance = "0"
unit = "R"

[[lessons.questions]]
id = "2.4.6"
kind = "choice"
prompt = "Desde 2020, el costo por operación de la estrategia en uso bajó a menos de la mitad. ¿Qué explicación da el informe?"
options = [
  { id = "a", text = "Que IG bajó los spreads a la mitad en 2020." },
  { id = "b", text = "Que el índice cotiza más alto y el mismo spread en puntos pesa menos frente al stop (y que el spread de 2011 no se conoce)." },
  { id = "c", text = "Que la estrategia empezó a ganar." },
]
answer = "b"
