# Catálogo de la Academia (docs/design/2026-11-academia.md §3 y §4, #709, #717).
# Lo lee y lo valida al arrancar el motor (crate cfds-academy); la UI lo recibe sin las claves en
# academy_catalog.v1 (GET /api/v1/academy/catalog). Nada de esto toca el motor de trading, el
# riesgo ni el paper: solo qué se enseña, cómo se corrige y qué se ve en la UI.
#
# Por ahora, niveles 0 a 2. Las preguntas y sus claves llegan con el PR de contenido de cada nivel
# (§8, PR 6), con cada cifra verificada contra su fuente: mientras una lección con examen no tenga
# preguntas, su examen sale `ready = false` y no se puede rendir (sus herramientas se abren solo a
# mano, en Ajustes).
#
# Formato de las preguntas (cuando lleguen), dentro de la lección:
#   [[lessons.questions]]
#   id = "2.2.1"             # <lección>.<n>
#   kind = "choice"          # choice | number
#   prompt = "..."
#   options = [{ id = "a", text = "..." }, { id = "b", text = "..." }]
#   answer = "a"             # choice: id de la opción. number: string decimal
#   # tolerance = "0.01"     # solo number: |respuesta − clave| <= tolerancia
#   # unit = "pts"           # solo number, opcional

[thresholds]
# PROVISORIOS (propuesta del diseño, §10.3 y §10.5): son parámetros EDUCATIVOS, no de trading, y
# el dueño los puede cambiar cuando quiera; hasta que los apruebe, la UI los muestra como
# provisorios (`provisional = true`).
# Porcentaje de respuestas correctas para aprobar un examen de preguntas.
quiz_pass_pct = "80"
# true: una herramienta bloqueada se ve gris con un candado y dice qué lección la abre.
locked_tools_visible = true
provisional = true

[replay]
# Exámenes con replay (§5 del diseño, #721): velas reales guardadas, instrumento, timeframe y fecha
# al azar con una semilla, SOLO dentro del período de investigación (nunca los meses fuera de
# muestra de config/data_split.toml). La fecha real no viaja hasta el final.
# PROVISORIOS (propuesta del diseño, §10.3 y §10.4): parámetros EDUCATIVOS, no de trading; el dueño
# los puede cambiar cuando quiera.
# Instrumentos del catálogo con velas de futuros guardadas: ES, NQ e YM desde 2011; FDAX solo desde
# 03-2025 (su período de investigación es corto). Los costos son los del CFD de
# config/instruments.toml.
instruments = ["US500", "US100", "US30", "DE40"]
timeframes = ["15m", "1h"]
# Velas: hoy solo las de los futuros (futures_candles de `futures_source`); las del CFD de IG casi
# no tienen historia antes del fuera de muestra.
source = "futures"
futures_source = "databento"
# Velas de calentamiento que se ven antes de empezar.
warmup_bars = 300
# Velas del examen después del calentamiento (niveles y operaciones), y de una práctica libre.
exam_bars = 400
practice_bars = 200
# Operaciones mínimas de un examen de operaciones, para que una sola no decida.
trades_per_exam = 10
# Tolerancia de los niveles marcados contra los del motor, en múltiplos del ATR al cursor.
level_tolerance_atr = "0.25"
# Mover el precio para que no se reconozca el año: no (cambia los números redondos). Solo false.
shift_prices = false
# Velas por paso como máximo, sesiones abiertas a la vez en memoria del gateway (la más vieja se
# cierra) y sorteos de fecha antes de rendirse (días sin velas, feriados).
max_step_bars = 100
max_sessions = 8
max_draws = 20

# Herramientas con candado (id estable que usa la UI). La lección que la abre es la que la lista
# en `unlocks`; cada herramienta la abre exactamente una lección.
[[tools]]
id = "tool.watchlist"
name = "Watchlist"

[[tools]]
id = "tool.instrument_panel"
name = "Panel del instrumento"

[[tools]]
id = "tool.glossary"
name = "Glosario interactivo"

[[tools]]
id = "tool.source_selector"
name = "Selector de fuente (CFD / futuros)"

[[tools]]
id = "tool.ticket_costs"
name = "Columna de costos del ticket"

[[tools]]
id = "tool.cost_calculator"
name = "Calculadora de costos"

[[levels]]
level = 0
title = "Orientación: qué es esto y por qué la mayoría pierde"

[[levels]]
level = 1
title = "Instrumentos: contado, futuros y CFD; apalancamiento y margen"

[[levels]]
level = 2
title = "Costos reales: lo que se come la ventaja"

# exam: quiz (preguntas que corrige el motor) | none (se completa sin nota).
[[lessons]]
id = "0.1"
title = "Qué es un mercado"
objective = "Entender que del otro lado hay alguien, y que el precio es el último acuerdo."
exam = "quiz"
unlocks = ["tool.watchlist", "tool.instrument_panel"]

[[lessons]]
id = "0.2"
title = "Cuántos pierden"
objective = "Saber el dato duro antes de empezar: cuántas cuentas minoristas de CFD pierden dinero, con su fuente."
exam = "quiz"
unlocks = ["tool.glossary"]

[[lessons]]
id = "0.3"
title = "Cómo se usa la Academia"
objective = "Simulación siempre, proceso antes que resultado, nada de promesas."
exam = "none"
unlocks = []

[[lessons]]
id = "1.1"
title = "Contado, futuros y CFD"
objective = "Saber qué se compra en cada uno: el activo, un contrato con vencimiento o una diferencia de precio con un broker."
exam = "quiz"
unlocks = ["tool.source_selector"]

[[lessons]]
id = "1.2"
title = "Largo y corto"
objective = "Ganar si sube o si baja, y qué se pierde en cada caso."
exam = "quiz"
unlocks = []

[[lessons]]
id = "1.3"
title = "Apalancamiento y margen"
objective = "Entender el margen minorista, nuestro tope propio de apalancamiento y el cierre por margen."
exam = "quiz"
unlocks = []

[[lessons]]
id = "2.1"
title = "Spread"
objective = "Saber que se entra pagando, y cuánto es nuestro spread típico en cada instrumento."
exam = "quiz"
unlocks = ["tool.ticket_costs"]

[[lessons]]
id = "2.2"
title = "Financiación nocturna (swap)"
objective = "Calcular el costo de dormir con una posición abierta."
exam = "quiz"
unlocks = []

[[lessons]]
id = "2.3"
title = "Slippage y comisión"
objective = "Saber que el precio de la orden no es el precio que te dan."
exam = "quiz"
unlocks = []

[[lessons]]
id = "2.4"
title = "Caso real: los costos mataron la estrategia"
objective = "Leer un resultado propio antes de costos, con costos y neto."
exam = "quiz"
unlocks = ["tool.cost_calculator"]
