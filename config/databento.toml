# Histórico intradía de futuros desde Databento (ADR 0011, en propuesta; importador #247).
# Se valida al arrancar (`cfds_intel.databento.config`). La key va en el .env
# (DATABENTO_API_KEY), nunca acá. Los datos se guardan solo en la base local de la máquina de
# datos (CFDS_DATA_MACHINE=1), nunca en el repo.

[download]
# Esquema oficial de velas de 1 minuto (docs: schemas-and-data-formats/ohlcv).
schema = "ohlcv-1m"
# Contrato continuo: RAÍZ.REGLA.RANGO (docs: standards-and-conventions/symbology). Se usa `c.0`,
# el vencimiento más cercano: su base es la más chica y la más parecida al CFD de contado, y el
# costo está medido con él (ADR 0011: USD 30,45 en total al 23-11-2026). Si se cambia a `v.0`,
# medirlo antes con --estimate.
stype_in = "continuous"
# Desde cuándo se quiere el histórico. Si un dataset empieza después, se baja desde su inicio,
# que sale de metadata.get_dataset_range en cada corrida (nunca fijo acá): Eurex (XEUR.EOBI)
# arranca el 2025-03-10 (medido el 23-11-2026). El fin es la medianoche UTC de hoy (exclusivo).
# Si ya hay datos guardados desde una fecha posterior, --run baja también el tramo anterior.
# 2011-01-01: decisión del dueño del 24-11-2026 (#369, unos 15 años de ES, NQ y YM).
start = "2011-01-01"

[budget]
# Tope de gasto total (USD) de una corrida, por debajo de los USD 125 de crédito gratis. Si la
# estimación lo pasa, --estimate y --run frenan sin bajar nada.
max_usd = "100"

[sample]
# Validación de --sample sobre un día UTC: huecos entre barras de más de estos minutos cuentan
# como huecos, salvo el más largo (la pausa diaria del mercado).
max_gap_minutes = 5

# Futuro → instrumento (CFD de IG). `min_session_hours`: horas mínimas con barras en un día UTC
# hábil (CME opera unas 23 h; Eurex, unas 21 h).
#
# `publisher`: el único publisher cuyas barras se guardan. En Eurex, OHLCV trae DOS registros
# para el mismo minuto si hubo operaciones dentro y fuera del libro: "one with XEUR.EOBI.XEUR as
# the publisher_id and one with XEUR.EOBI.XOFF" (docs: datasets/xeur-eobi). Las fuera de libro
# (TES: bloques, EFP) se pactan a precios que no son del mercado, así que solo se guarda el libro
# central (XEUR.EOBI.XEUR). CME tiene un solo publisher (GLBX.MDP3.GLBX). Los nombres se validan
# contra la lista del SDK oficial (databento.Publisher).
[[symbols]]
dataset = "GLBX.MDP3"
symbol = "ES.c.0"
publisher = "GLBX.MDP3.GLBX"
instrument_id = "US500"
min_session_hours = 22

[[symbols]]
dataset = "GLBX.MDP3"
symbol = "NQ.c.0"
publisher = "GLBX.MDP3.GLBX"
instrument_id = "US100"
min_session_hours = 22

[[symbols]]
dataset = "GLBX.MDP3"
symbol = "YM.c.0"
publisher = "GLBX.MDP3.GLBX"
instrument_id = "US30"
min_session_hours = 22

# FDAX.c.0 existe y tiene ohlcv-1m (metadata, 23-11-2026). Histórico solo desde 2025-03-10.
[[symbols]]
dataset = "XEUR.EOBI"
symbol = "FDAX.c.0"
publisher = "XEUR.EOBI.XEUR"
instrument_id = "DE40"
# Se mide en minutos con barra (horas = barras / 60). La sesión de Eurex va de ~00:15 a ~21:00 UTC,
# pero de madrugada hay minutos sin operaciones en el libro central y esos minutos no tienen barra:
# el 2026-11-20 dio 1112 barras (18,5 h) en 20,8 h de sesión. Medido con --sample el 23-11-2026.
min_session_hours = 18

# Russell 2000 (#371): solo para el estudio en backtest. RTY se negocia en CME Globex desde julio
# de 2017; antes estaba en ICE (TF), así que GLBX.MDP3 no lo tiene. `start` propio (#410), medido
# gratis con la metadata el 24-11-2026: `symbology.resolve` de RTY.c.0 da "not_found" antes de
# 2016 y `get_record_count` da 422 (symbology_invalid_request) hasta mayo de 2017, 0 barras del
# 2017-06-01 al 2017-07-08 y las primeras barras el domingo 2017-07-09 (6 barras; 340 el lunes 10).
[[symbols]]
dataset = "GLBX.MDP3"
symbol = "RTY.c.0"
publisher = "GLBX.MDP3.GLBX"
instrument_id = "US2000"
min_session_hours = 22
start = "2017-07-09"

# Oro (#371): solo para el estudio. Futuro de COMEX en CME Globex, que opera unas 23 h.
# Va con `v.0` (el vencimiento de más volumen) y no con `c.0`: en el oro, el vencimiento más
# cercano en el calendario casi nunca es el que se negocia (los activos son feb, abr, jun, ago,
# oct y dic). Medido con --estimate el 24-11-2026, de 2011 a hoy: GC.c.0 da 241.103 barras
# (USD 0,88), casi sin operaciones, y GC.v.0 da 5.513.746 (USD 20,13).
# `XAUUSD` todavía no está en config/instruments.toml (falta decidir clase de activo, sesión y
# financiación): las barras de 1 minuto se guardan igual (`futures_bars_1m` no depende del
# catálogo), pero no se arman velas hasta que esté.
[[symbols]]
dataset = "GLBX.MDP3"
symbol = "GC.v.0"
publisher = "GLBX.MDP3.GLBX"
instrument_id = "XAUUSD"
min_session_hours = 22
