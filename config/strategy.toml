# Puntaje de confluencia y stop estructural (spec §6 y §8). Todo lo ajustable vive acá.

[score]
# Puntaje mínimo para que una señal pase a ser candidata a propuesta.
min_score = 5
# Tendencia de 1h a favor / en contra (neutral suma 0).
trend_with = 2
trend_against = -3
# Precio del lado correcto de la SMA de 15m.
sma_side = 1
# Gatillos.
candle_pattern = 1
double_break = 2
level_rejection = 1
sweep = 2
# Contexto.
fvg_or_order_block = 1
recent_choch = 1
# Rango permitido del ajuste por noticias (spec §9).
news_min = -2
news_max = 2

[stop]
# El stop va `atr_buffer` × ATR más allá de la estructura.
atr_buffer = "0.5"

[evidence]
# Período de la SMA de 15m ("precio del lado correcto de la SMA50", spec §6).
sma_period = 50
# Calentamiento (spec §3): ninguna señal hasta tener estas velas válidas de cada timeframe.
# Se cuentan velas cerradas: la de 1h, recién cuando cerró (multi-timeframe).
min_m15_candles = 200
min_h1_candles = 60

# Ajuste de noticias del puntaje y alerta de salida (spec §9, #130). Decidido por el dueño el
# 22-11-2026: por noticia redondear(2 × sentimiento × relevancia), con ±0,5 hacia cero; las
# noticias de la ventana se suman y se recortan a [score.news_min, score.news_max]; en un corto
# el ajuste cambia de signo.
[news]
# Solo cuentan las noticias publicadas en las últimas N horas antes del cierre de la vela.
window_hours = 4
# Alerta de salida de una posición abierta: noticia en contra con relevancia y |sentimiento|
# mayores o iguales a estos valores. No cierra sola: avisa al responsable.
alert_min_relevance = "0.7"
alert_min_abs_sentiment = "0.7"
