# Fuentes de velas para la liquidez (#259). Se valida al arrancar
# (`cfds_market_data::CandleSources`).
#
# - "ig": las velas del CFD de IG (`candles`). Es la fuente por omisión.
# - "futures": las velas de 15m y 1h armadas desde las barras de 1 minuto de los futuros de
#   Databento (`futures_candles`, ADR 0011). Tienen la forma del precio del futuro, con su base
#   distinta a la del CFD, y no tienen diarias.
#
# Lo que la liquidez calcula con los futuros se guarda bajo un instrumento derivado
# (`<instrumento><id_suffix>`, por ejemplo US500.FUT). Así nunca se mezcla en las tablas de
# niveles, FVG y desequilibrio con lo calculado sobre el CFD, y los cálculos son los mismos.

[ig]
label = "IG CFD"

[futures]
# Valor de `source` en futures_candles.
source = "databento"
label = "futuros CME/Eurex (base distinta al CFD)"
id_suffix = ".FUT"
# Diarias de los futuros (#282): de medianoche a medianoche en esta zona, igual que las diarias
# de IG (config/ig.toml `prices_timezone`; un test controla que coincidan).
daily_timezone = "Europe/Madrid"
# Vencimientos (#269). El contrato continuo `c.0` es el del vencimiento más cercano (Databento:
# "calendar", sin ajuste de precios). No se usa el `instrument_id` de Databento para saber cuándo
# cambia el contrato: en Eurex (XEUR.EOBI) cambia de un día a otro y se reusa. Los índices de CME
# y de Eurex vencen el tercer viernes de estos meses; si ese día la bolsa está cerrada (feriado de
# config/holidays), el día hábil anterior.
expiry_months = [3, 6, 9, 12]

# Qué día el continuo ya es el contrato nuevo, medido en los datos de Databento:
# - "after_expiry_day": el día del vencimiento todavía es del contrato viejo (CME: ES, NQ, YM);
# - "on_expiry_day": el día del vencimiento ya es del nuevo (Eurex: el viejo deja de operar a
#   media mañana).
[futures.roll]
US500 = "after_expiry_day"
US100 = "after_expiry_day"
US30 = "after_expiry_day"
DE40 = "on_expiry_day"
