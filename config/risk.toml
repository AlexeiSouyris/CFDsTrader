# Límites de riesgo (spec §7, §8 y §10). Módulo independiente: la estrategia no los puede saltear.
# Porcentajes como texto decimal (nunca float). El tope de apalancamiento y el margen de cada
# instrumento salen de config/instruments.toml.

[limits]
# Riesgo por operación, en % del capital actual.
risk_per_trade_pct = "1"
# Pérdida del día (realizada + no realizada desde las 00:00 de Madrid) que corta las entradas.
max_daily_loss_pct = "3"
# Drawdown desde el máximo del fondo que activa el kill switch.
max_drawdown_pct = "15"
max_open_positions = 5
max_positions_per_instrument = 1

[stop_distance]
# La distancia al stop tiene que estar entre estos múltiplos del ATR (spec §7.7).
min_atr = "0.5"
max_atr = "3"
