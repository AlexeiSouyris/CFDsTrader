[[fed.schedule_announcements]]
url = "https://www.federalreserve.gov/newsevents/pressreleases/monetary20190517a.htm"
years = [2020]

[[fed.schedule_announcements]]
url = "https://www.federalreserve.gov/newsevents/pressreleases/monetary20200702a.htm"
