# Gateway: API del motor para la UI (#231, #278): lectura, más las rutas del broker simulado (solo paper).

[server]
# Dirección donde escucha. Por defecto solo la máquina local; la UI llega con el proxy de Vite.
bind = "127.0.0.1:8787"

[view]
# Lo que la vista de liquidez abre primero. DE40 en 1d es lo que hoy tiene datos reales (#231).
default_instrument = "DE40"
default_timeframe = "1d"
# Niveles con exists_from en estos días hacia atrás desde as_of (alcanza para PDH/PDL y PWH/PWL).
levels_days = 14

# Ventana de cada timeframe, en días hacia atrás desde as_of (el cierre de la última vela):
# velas (y desequilibrio) que se mandan, y FVG creados en ese lapso.
[windows.15m]
candles_days = 3
fvg_days = 7

[windows.1h]
candles_days = 15
fvg_days = 30

[windows.1d]
# Unas 250 sesiones.
candles_days = 365
fvg_days = 365

# Broker simulado (fase 7, #278): rutas /api/v1/paper/* y /api/v1/backtest_runs. Solo paper.
[paper]
# Variable de entorno con el token local que exigen los POST (cabecera x-cfds-token). Sin la
# variable, la escritura queda apagada. Es la defensa anti-CSRF: otra web abierta en el navegador
# no conoce el token ni puede mandar la cabecera sin un preflight de CORS, que no se contesta.
token_env = "CFDS_GATEWAY_TOKEN"
# Tamaño máximo del body de un POST (un order.v1 ocupa unos 300 bytes).
max_body_bytes = 16384
# Una orden con created_at más viejo que esto (o en el futuro) se rechaza.
max_order_age_secs = 60
# Velas de 15m que el broker carga hacia atrás al arrancar (ATR y salidas).
candles_days = 10
# Corridas de backtest que devuelve /api/v1/backtest_runs (las más nuevas).
runs_limit = 50

# Estado de la operación (#314): /api/v1/ops/status y /api/v1/ops/events, solo lectura.
[ops]
# Eventos del broker y alertas que se guardan en memoria (los últimos) para la UI.
feed_size = 50
# Eventos iguales (mismo nivel, origen, nombre y campos) se agrupan en una fila con `count` y
# `last_seen` (#576). Cuántos grupos devuelve GET /api/v1/ops/events sin ?limit= (1..=feed_size).
events_limit = 20
# Cuántas filas de ops_events se leen para agruparlas (feed_size..=100000).
group_scan = 2000
# Días de eventos que conserva la base (#337). Los borra el job de retención:
#   DATABASE_URL=... cargo run -p cfds-gateway --example ops_events_retention
retention_days = 30
# Eventos que pueden esperar para guardarse (cola y pendientes con la base caída). Si no
# entran, quedan solo en memoria: el broker nunca espera a la base.
persist_queue = 1000
# Segundos entre reintentos si la base no responde.
retry_secs = 30

# Velas de IBKR para la terminal de la app (#551): /api/v1/ibkr/bars y /api/v1/ibkr/watchlist,
# solo lectura de ibkr_bars. El día de sesión de la variación sale de [session] de
# config/terminal.toml (el mismo criterio que la terminal bolsa).
[ibkr]
# Fuente de las velas guardadas: la de [load] source de config/ibkr.toml.
source = "ibkr"
# Instrumentos de la watchlist, en orden. Cada uno está en config/ibkr.toml (sin futuros continuos).
instruments = ["MNQ", "MES", "QQQ"]
# Velas que devuelve /api/v1/ibkr/bars sin ?limit, y el máximo que acepta ?limit.
default_bars = 500
max_bars = 5000
# Vela en formación (#558, solo visual): GET /api/v1/ibkr/live (SSE, contracts/ibkr_live_bar.v1).
# Con true, el gateway abre su propia conexión de streaming a IB Gateway paper con [live] de
# config/ibkr.toml (client_id 21, mismas guardas: puerto, cuenta paper de .env, kill switch). Si IB
# Gateway está cerrado, el gateway arranca igual y la ruta informa "disconnected". Con false no se
# conecta nada y la ruta informa "disabled".
live = true
# Conexiones SSE abiertas a la vez, como máximo (cada gráfico abierto es una).
live_max_clients = 16
# Cada cuánto va un comentario SSE (": ping") para que nada corte una conexión sin mensajes.
live_heartbeat_secs = 15

# Contexto de mercado del Panel (#294): /api/v1/sentiment y /api/v1/analogs, solo lectura.
[context]
# Valores del índice de sentimiento que devuelve la historia de un instrumento (los últimos).
sentiment_history = 400

