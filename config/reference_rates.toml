# Tipos de referencia diarios de la financiación nocturna (#79). Los lee el motor para el costo
# de financiación de cada noche; el valor constante de [funding_benchmarks] en
# config/instruments.toml queda solo como respaldo documentado.
#
# Fuente: API de datos del BCE (fuente `ecb-estr` de config/instruments.toml).
# "The ECB does not charge for the €STR or license its use".

[api]
base_url = "https://data-api.ecb.europa.eu/service/data"
user_agent = "cfds-intel/0.1 (automated data reader)"
timeout_secs = 60

# Una tabla por serie. El nombre ("ESTR") es el mismo que el de [funding_benchmarks].
[series.ESTR]
# Clave de la serie en la API del BCE: flujo "EST", clave "B.EU000A2X2A25.WT".
flow = "EST"
key = "B.EU000A2X2A25.WT"
# Primer valor publicado del €STR: el del 1-10-2019.
start = "2019-10-01"
# "The ECB publishes the €STR at 08:00 CET on each TARGET2 business day", con las operaciones
# del día hábil anterior. Si hay un error de más de 2 puntos básicos, "the ECB will revise and
# re-publish the €STR once on the same day at 09:00 CET" y no cambia más (página "€STR overview"
# del BCE, consultada el 22-11-2026). Se toma las 09:00, la hora más conservadora.
# El "día hábil siguiente" es la fecha del valor siguiente de la misma serie. Para el último
# valor todavía no se conoce, así que vale desde que el sistema lo leyó.
publication_time = "09:00"
publication_timezone = "Europe/Berlin"

# ---------------------------------------------------------------- Reserva Federal de Nueva York
# Tasas en USD de la base de los futuros de índices de CME (#467, ADR 0015): las usa el backtest
# con velas de futuros para no contar la tasa dos veces (config/candle_sources.toml
# [futures.basis]). API pública: https://markets.newyorkfed.org/api/rates/<ruta>/search.json
# "Use of the Reference Rates are subject to important disclaimers, limitations and
# indemnification obligations" (https://www.newyorkfed.org/markets/reference-rates/sofr y sus
# términos de uso, /privacy/termsofuse).
#
# Publicación (página "Additional Information about Reference Rates", consultada el 24-11-2026):
# la SOFR "is published one business day following its value date", hacia las 8:00 ET; la EFFR,
# "at approximately 9:00 a.m. ET each business day". Las dos se pueden revisar "at approximately
# 2:30 p.m. ET" del mismo día, solo si el cambio supera un punto básico. Se toma las 15:00 ET, la
# hora más conservadora. Como en el BCE, el "día hábil siguiente" es la fecha del valor siguiente
# de la misma serie; el último valor vale desde que se leyó.
[nyfed]
base_url = "https://markets.newyorkfed.org/api/rates"
user_agent = "cfds-intel/0.1 (automated data reader)"
timeout_secs = 60

[nyfed.series.EFFR]
path = "unsecured/effr"
type = "EFFR"
# Desde antes de las primeras velas de los futuros (2011-01-02), con margen de calentamiento.
start = "2010-11-01"
publication_time = "15:00"
publication_timezone = "America/New_York"

[nyfed.series.SOFR]
path = "secured/sofr"
type = "SOFR"
# Primer valor publicado de la SOFR: el del 2-4-2018 (publicado el 3-4-2018).
start = "2018-04-02"
publication_time = "15:00"
publication_timezone = "America/New_York"
