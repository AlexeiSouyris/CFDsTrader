# Backtest: salidas de una operación (spec §8). Decimales como texto (nunca float).

[exits]
# TP1 en entrada + `tp1_r` × R: se cierra `tp1_fraction` de la posición y el stop pasa a la entrada.
tp1_r = "2"
tp1_fraction = "0.5"
# Trailing del resto: stop = max(stop actual, máximo desde TP1 − `trailing_atr` × ATR).
trailing_atr = "2"
# Si a las `time_exit_bars` velas no tocó +`time_exit_min_r` R, se cierra al cierre de esa vela.
time_exit_bars = 32
time_exit_min_r = "1"

[costs]
# Slippage supuesto por ejecución (spec §11): `slippage_spread_fraction` × spread + `slippage_ticks` ticks.
slippage_spread_fraction = "0.1"
slippage_ticks = "1"

[metrics]
# Anualización de Sharpe y Sortino (días de mercado por año) y tasa libre de riesgo anual en %.
trading_days_per_year = 252
risk_free_annual_pct = "0"

[account]
# Zona del "día" de la pérdida diaria y de la curva de capital (spec §10: desde las 00:00 de Madrid).
day_timezone = "Europe/Madrid"

[kill_switch]
# SOLO EN BACKTEST (#277, spec §10): después de un kill switch por drawdown, el recorrido se
# reactiva solo pasados estos días hábiles (lunes a viernes, en `day_timezone`), como si el grupo
# hubiera votado reactivarlo. El drawdown se vuelve a medir desde el capital de ese momento.
# 0 = nunca (igual que en vivo). `backtest_run --reiniciar-kill-switch-dias N` lo cambia en una
# corrida. En vivo no existe: config/risk.toml no tiene este parámetro y cfds-risk no lo conoce.
reset_after_business_days = 20
