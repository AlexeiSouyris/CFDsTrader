# Intérprete de noticias con un modelo abierto local (ADR 0008, #129). Corre en el Mac mini con
# Ollama (MIT), solo en localhost: ninguna noticia ni respuesta sale de la máquina.
# API usada (documentación oficial, github.com/ollama/ollama/blob/main/docs/api.md):
# POST /api/chat (stream=false, format=JSON Schema, options.temperature y options.seed),
# GET /api/tags (digest de cada modelo) y GET /api/ps (memoria del modelo cargado).

[ollama]
# Solo http://127.0.0.1 o http://localhost: cualquier otro host es un error al cargar.
url = "http://127.0.0.1:11434"
timeout_secs = 120

[generation]
# Determinismo (ADR 0008 §4): temperatura 0 y semilla fija para todos los candidatos.
temperature = 0
seed = 42
# Ventana de contexto en tokens, igual para todos los candidatos. Sin fijarla, Ollama reserva la
# máxima del modelo (40.960 en Qwen3-8B, ~10 GB cargado) aunque cada noticia use ~1.700 tokens
# (el texto se recorta a text.max_chars). Decidido por el dueño el 22-11-2026, antes de ver
# ningún resultado de acierto de la prueba.
num_ctx = 8192
# Cada noticia se procesa desde cero: el modelo se descarga después de cada respuesta. Sin esto,
# Ollama reusa los cálculos del pedido anterior y la misma noticia puede dar otro resultado
# (medido el 22-11-2026 con Ministral 3 8B: el titular #17 cambia de relevancia y suma un índice
# al reusar; desde cero da siempre lo mismo). Cuesta unos segundos más por noticia.
keep_alive = 0
# Para modelos con "pensamiento" (por ejemplo Qwen3): no pensar, responder directo.
think = false

[model]
# Elegido con la prueba de selección del ADR 0008 §4 y aprobado por el dueño el 22-11-2026
# ("si, elegí Ministral", #129). Resultado: válidas 100 %, deterministas 100 %, p95 25,2 s,
# memoria 5,39 GB, acierto de signo 60,8 % [47,1, 73,0] en 51 pares, relevancia 83,6 %.
# Qwen3-8B no pasó (relevancia 62,4 % < 70 %).
name = "hf.co/mistralai/Ministral-3-8B-Instruct-2512-GGUF:Q4_K_M"
# Digest de GET /api/tags del modelo elegido: si el instalado no coincide, no se interpreta.
digest = "e8294492472089284eff74350fbd8f076baee56577a125dd6f32205feba144e8"
# Look-ahead en el backtest (ADR 0008 §5, #194): solo cuentan las interpretaciones de noticias
# publicadas DESPUÉS de esta fecha (desde las 00:00 UTC del día siguiente). Es la fecha de corte de
# entrenamiento si el fabricante la publica; si no, la de publicación del modelo.
# Mistral no publica la fecha de corte de Ministral 3 8B (ni en docs.mistral.ai ni en la ficha de
# Hugging Face, consultadas el 23-11-2026). Fecha de publicación oficial: "Release date:
# 2025-12-02" (https://docs.mistral.ai/models/ministral-3-8b-25-12.md). La lee el motor (Rust).
training_cutoff = "2025-12-02"

# Texto oficial de cada noticia (ADR 0008 §4, decisión del dueño del 22-11-2026): el intérprete
# lee el comunicado del enlace del RSS, no solo el título. El texto nunca se guarda ni se
# republica (ADR 0006): solo queda la interpretación.
[text]
allowed_hosts = ["www.federalreserve.gov", "www.ecb.europa.eu"]
# Recorte del texto para que entre en el contexto del modelo local.
max_chars = 6000
user_agent = "cfds-intel/0.1 (automated news reader)"
timeout_secs = 30
# Documentos que la página del comunicado solo enlaza (actas del FOMC, proyecciones, #168): se
# sigue un solo enlace, el primero cuya ruta coincide con uno de estos patrones, solo por HTTPS
# y en un sitio de allowed_hosts. El orden es la preferencia: HTML antes que PDF.
# Verificado en el Mac mini el 22-11-2026: el comunicado de actas del 18-11-2026 lleva a
# fomcminutes20261028.htm y el de proyecciones del 16-09-2026 a fomcprojtabl20260916.htm.
follow = [
  "^/monetarypolicy/fomcminutes\\d{8}\\.htm$",
  "^/monetarypolicy/fomcprojtabl\\d{8}\\.htm$",
  "^/monetarypolicy/files/fomcminutes\\d{8}\\.pdf$",
  "^/monetarypolicy/files/fomcprojtabl\\d{8}\\.pdf$",
]

# Criterios de la prueba de selección (ADR 0008 §4), fijados antes de mirar resultados.
# Números aprobados por el dueño el 22-11-2026.
[selection]
min_relevant_pairs = 20
# Hacen falta al menos estos pares relevantes con signo "+" y otros tantos con "-".
min_signed_pairs_each = 10
# Detección de relevancia (medida aparte): el modelo marca relevante si relevancia ≥ esto,
# y el acierto balanceado contra las etiquetas tiene que ser ≥ min_relevance_accuracy_pct.
relevance_threshold = "0.5"
min_relevance_accuracy_pct = 70
min_valid_pct = 99
max_memory_gb = 8
max_seconds_p95 = 60
tie_points = 5
