# Especificaciones de los 15 futuros estándar del programa 6 (borrador, #672). SOLO DATOS DE
# REFERENCIA, verificados: no hay elecciones del dueño acá (los parámetros del programa van en
# config/research.toml al congelar). Lo lee y lo valida `cfds_market_data::FuturesContracts`
# (engine/crates/market-data/src/futures_contracts.rs); un test lee este archivo.
#
# FUENTES (por campo; consultadas el 25-11-2026):
# - ibkr_symbol, trading_class, exchange, currency, multiplier, tick_size, timezone, session_open,
#   session_close, listed_months, next_contract, next_last_trade: IBKR `reqContractDetails` de
#   solo lectura (IB Gateway paper, 127.0.0.1:4002, client_id 18), con
#   `cargo run -p cfds-ibkr --example ibkr_probe -- --details SÍMBOLO BOLSA MONEDA`.
#   session_open/close: el horario de IBKR de la semana del 24-11-2026 (domingo a viernes, hora de
#   `timezone`; la sesión abre el día anterior y cierra con una pausa diaria entre close y open).
#   listed_months: los meses de los vencimientos que IBKR tenía listados ese día (letras de CME:
#   F ene, G feb, H mar, J abr, K may, M jun, N jul, Q ago, U sep, V oct, X nov, Z dic).
# - multiplier, tick_size, tick_value, currency y horario: comparados uno por uno con la página
#   oficial de CME de cada contrato (`spec_url`), leída el 25-11-2026. Todos coinciden.
# - tick_value = tick_size × multiplier (lo verifica el validador) y es el que publica CME.
#
# FDAX (Eurex) no está: queda fuera del universo según el punto abierto 5 del programa 6.
# Este archivo NO dice qué vencimiento operar ni cuándo cambiar: eso es del programa.

checked_on = "2026-11-25"

# Comisión de IBKR para futuros estándar de EE. UU. (no micro), USD por contrato y por lado.
# Fuente: https://www.interactivebrokers.com/en/pricing/commissions-futures.php?region=americas
# (página pública, leída el 25-11-2026, sin login). Las tasas de bolsa, de clearing y regulatorias
# se cobran APARTE en los dos planes (la página las lista por separado y no da un monto único);
# no están en este archivo y no se inventan.
[commission_ibkr_us]
source_url = "https://www.interactivebrokers.com/en/pricing/commissions-futures.php?region=americas"
fixed_usd = "0.85"
exchange_fees_included = false
# Plan escalonado (tiered): por volumen mensual de contratos, marginal dentro del mes.
[[commission_ibkr_us.tiered]]
up_to_contracts = 1000
usd = "0.85"
[[commission_ibkr_us.tiered]]
up_to_contracts = 10000
usd = "0.65"
[[commission_ibkr_us.tiered]]
up_to_contracts = 20000
usd = "0.45"
[[commission_ibkr_us.tiered]]
# Sin tope: más de 20.000 contratos.
usd = "0.25"

