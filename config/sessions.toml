# Sesiones de contado de cada bolsa (spec §2). Horas en hora LOCAL de la bolsa:
# los cambios de horario de verano se resuelven solos con la zona horaria.
# Qué instrumento usa qué bolsa se define en config/instruments.toml (Issue #7).
#
# Velas esperadas dentro de la sesión: las alineadas a su timeframe (15m o 1h, en UTC) que
# caben enteras entre la apertura y el cierre. Ej.: Nueva York 09:30–16:00 → 26 velas de 15m
# y 6 de 1h (10:00 a 15:00).

[sessions.XNYS]
name = "New York Stock Exchange"
timezone = "America/New_York"
open = "09:30"
close = "16:00"
holidays = "holidays/XNYS.toml"

[sessions.XETR]
name = "Xetra (Deutsche Börse)"
timezone = "Europe/Berlin"
open = "09:00"
close = "17:30"
holidays = "holidays/XETR.toml"

# Oro de CME Globex (futuro GC, ADR 0013). Sesión de casi 23 h que cruza la medianoche: como
# `open` es posterior a `close`, la sesión del día hábil D abre el día ANTERIOR a las 17:00 y
# cierra D a las 16:00 (hora de Chicago; 18:00–17:00 en Nueva York, los dos cambian de horario
# juntos). Entre sesiones queda la pausa diaria de 60 minutos. La del lunes abre el domingo.
# Es el horario de CME, usado como aproximación del de IG hasta confirmarlo (ADR 0013, pendiente).
# Ojo: es el horario del MERCADO (velas, validación, stops). La ventana de entradas propia del
# oro todavía no está definida: sin ella, el oro no abre operaciones (#418).
[sessions.CMEGLOBEX_METALS]
name = "CME Globex, metales (oro)"
timezone = "America/Chicago"
open = "17:00"
close = "16:00"
holidays = "holidays/CMEGLOBEX_METALS.toml"
