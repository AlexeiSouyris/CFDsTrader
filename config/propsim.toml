# Simulador de cuentas fondeadas (Academia, #802; docs/design/2026-11-academia.md §6). Lo lee el
# motor (cfds-propsim) y lo sirve el gateway. Ni el runner, ni el paper, ni la estrategia en uso
# lo leen: es EDUCATIVO y no decide ninguna operación.
#
# PENDIENTE del dueño: los topes de [limits] son valores propuestos para poder construir el
# simulador, no parámetros de trading.

[limits]
# Operaciones de una lista (las de un informe del laboratorio incluidas).
max_trades = 20000
# Riesgo por operación máximo que se puede simular, en % del tamaño de la cuenta. Más alto que
# config/risk.toml a propósito: para VER qué pasa con riesgos altos en una evaluación.
max_risk_pct = "10"

[monte_carlo]
# Monte Carlo del simulador (#803): días reales remuestreados en bloques (research::montecarlo) o
# días sorteados con el modelo del simulador de varianza (research::variance). PENDIENTE del
# dueño: valores propuestos, educativos.
#
# Topes de lo que se puede pedir.
max_paths = 10000
max_horizon_days = 500
max_attempts = 20
max_trades_per_day = 20
# Caminos × días por intento, como mucho (la ruta es sincrónica: 10 000 × 250).
max_day_steps = 2500000
# Valores cuando el pedido no los trae. 5000 caminos: el error de una probabilidad p es
# √(p(1−p)/5000) ≤ 0,7 %.
default_paths = 5000
default_seed = 20261126
# Bloques de 5 días operados (≈ T^(1/3) con ~125 días; Politis y Romano, 1992).
default_block_len_days = 5
# Días operados como mucho por intento (todas las etapas): ~un año de días con operaciones.
default_horizon_days = 250
# Intentos (cuotas) para el valor esperado.
default_max_attempts = 5
# Nivel de los intervalos de Wilson.
confidence = "0.95"

# ── Plantillas ─────────────────────────────────────────────────────────────────────────────
# Cada plantilla es un prop_rules.v1. NO se inventan reglas de firmas reales (CLAUDE.md §5b):
# - La genérica trae la forma de las reglas con todos los valores EN BLANCO: el usuario los
#   completa en la pantalla del simulador.
# - Una plantilla con algún valor es de una firma real y necesita `source` = { firm, url
#   (https, su reglamento publicado), read_at (fecha de lectura) }. El motor no arranca si falta.
#   Las firmas cambian sus reglas: al cargar una, se vuelve a leer su reglamento y se cambia la
#   fecha.

[[templates]]
id = "generica"
name = "Plantilla genérica (completá los valores)"
phases = [{ name = "Evaluación" }]
daily_loss = { base = "day_start" }
max_drawdown = { mode = "static", lock_at_initial = false }
funded = {}
fees = { refund_with_first_payout = false }
