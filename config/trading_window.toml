# Horario de entradas (spec §2 y §7.1). Se aplica sobre la sesión de cada bolsa
# (config/sessions.toml y sus feriados).

[entries]
# No se abren operaciones en los primeros minutos de cada sesión.
skip_after_open_minutes = 15
# No se abren operaciones nuevas en los últimos minutos del último día hábil de la semana
# (el viernes, o el día hábil anterior si el viernes es feriado).
no_new_before_week_close_minutes = 30

# Horas de entrada propias por bolsa (código de config/sessions.toml), además de la sesión.
# Formato: { timezone = "America/New_York", from = "HH:MM", to = "HH:MM" } (to excluida), o
# { pending = "motivo" }. Una sesión que cruza la medianoche (casi 23 h) NECESITA horas propias:
# sin ellas, o pendientes, no se abre ninguna operación (spec §2, ADR 0013).
[entries.hours.CMEGLOBEX_METALS]
pending = "las horas de entrada del oro las elige el dueño (ADR 0013 §2, #418); hasta entonces el oro no abre operaciones"
