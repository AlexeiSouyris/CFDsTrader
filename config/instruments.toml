# Russell 2000 (#371): solo para el estudio en backtest con el histórico de futuros RTY de Databento.
# No se opera en paper ni en vivo: sin epic, `ig_live` no lo pide, y con costos pendientes el broker
# simulado lo saltea. Ni ig.com/es/indices, ni /margenes, ni /nuestros-costes lo listan (consultado
# el 2026-11-24), así que los términos de IG quedan pendientes. No se llamó a la API de IG: el cupo
# semanal está debajo de la reserva (#360).
[instruments.US2000]
name = "Russell 2000"
asset_class = "index"
currency = "EUR"   # como los demás índices de EE. UU. (#67), si IG ofrece el contrato de 1 €; confirmar
exchange = "XNYS"
exchange_timezone = "America/New_York"
max_leverage = "10"   # tope propio de índices (spec §8); ESMA no lo trata como índice principal: su mínimo también es 10:1
epic = { pending = "No figura en las páginas públicas de IG España (2026-11-24). Confirmar con GET /markets/{epic} cuando haya cupo (#371)." }
margin_retail_pct = { pending = "No figura en ig.com/es/indices ni /margenes (2026-11-24). ESMA no lo trata como índice principal: mínimo regulatorio 10 %. Confirmar con la API de IG." }
spread_min_points = { pending = "No figura en ig.com/es/indices ni /nuestros-costes (2026-11-24). Confirmar con IG." }
spread_typical_points = { pending = "Sin dato publicado ni medido (2026-11-24). Medir en la demo como en #67 cuando haya cupo." }
value_per_point = { pending = "Confirmar con GET /markets/{epic} (valueOfOnePip) cuando haya cupo." }
min_deal_size = { pending = "Confirmar con GET /markets/{epic} (dealingRules.minDealSize) cuando haya cupo." }
tick = { pending = "Confirmar con GET /markets/{epic} (decimalPlacesFactor) cuando haya cupo." }
funding_admin_fee_pct = { pending = "IG España no lista este índice (2026-11-24). Si lo ofrece como CFD de índice, la tasa publicada para los CFD de índices es 3 % (fuente ig-es-costes-indices, #379). Confirmar que lo ofrece antes de fijarlo (#371)." }
funding_day_count = { value = "360", source = "ig-es-costes" }
funding_benchmark = { pending = "IG España no lista este índice (2026-11-24). Si lo ofrece, probablemente SOFR como US500, US100 y US30 (fuente ig-chat-sofr, #655), pero IG no lo confirmó para este índice. Confirmar con IG." }

# ---------------------------------------------------------------- materias primas
# ADR 0013 (aceptado el 24-11-2026), #418. Solo paper y estudio; nada con dinero real.
# Financiación de IG para materias primas (fuente ig-es-costes-materias-primas):
#   noches × tamaño × (base ± costo de IG), base = (P3 − P2) / (T2 − T1),
#   costo de IG = precio medio sin vencimiento × 3 % / 365
# No hay comisión: el costo es el spread. El contrato es en USD y la cuenta en EUR: se convierte
# con el EUR/USD del BCE (config/fx_rates.toml).
#
# El oro NO opera, ni en paper, mientras quede un pendiente: el backtest validado se frena (spec
# §11), el broker simulado saltea un instrumento con costos pendientes, sin epic `ig_live` no lo
# pide. Su ventana de entradas ya está fijada (07:00–16:00 UTC, config/trading_window.toml).

# Oro al contado. Sesión de CME Globex como aproximación de la de IG (config/sessions.toml).
[instruments.XAUUSD]
name = "Oro"
asset_class = "commodity"
currency = "USD"   # ninguna materia prima de la tabla de CFD de IG está en EUR (ADR 0013)
exchange = "CMEGLOBEX_METALS"
exchange_timezone = "America/Chicago"   # la de CME, la misma de config/sessions.toml
max_leverage = "10"   # tope propio del oro, la mitad del regulatorio 20:1 (spec §8, ADR 0013 §5)
funding_model = "commodity_basis"
epic = { pending = "La web de IG no lo publica. Confirmar con GET /markets/{epic} cuando haya cupo (#360)." }
margin_retail_pct = { value = "5", source = "ig-es-margenes-materias-primas" }
spread_min_points = { value = "0.9", source = "ig-es-costes-materias-primas" }
spread_typical_points = { pending = "Solo está el mínimo publicado. Medir en la demo como en #67 cuando haya cupo." }
value_per_point = { pending = "La tabla dice 'valor de un contrato 100 $', pero no el valor por punto. Confirmar con GET /markets/{epic} (valueOfOnePip)." }
min_deal_size = { pending = "Sin fuente pública (el 0,05 de #378 no tiene fuente). Confirmar con GET /markets/{epic} (dealingRules.minDealSize)." }
tick = { pending = "Confirmar con GET /markets/{epic} (decimalPlacesFactor) cuando haya cupo." }
funding_admin_fee_pct = { value = "3", source = "ig-es-costes-materias-primas" }
funding_day_count = { value = "365", source = "ig-es-costes-materias-primas" }
funding_benchmark = { pending = "Las materias primas no usan tipo de referencia sino la base de la curva de futuros. Falta qué futuros usa IG como P2 y P3 y qué lado paga la base (ADR 0013)." }

# ---------------------------------------------------------------- acciones (CFD)
# Las acciones no tienen spread de IG: pagan comisión al abrir y al cerrar (fuente ig-es-costes).
# Cada acción concreta se agrega cuando se arme la lista de seguimiento (spec §2).
# El margen del 20 % es el que muestra IG en sus ejemplos (Apple, Inditex...) y el mínimo regulatorio
# para acciones (5:1). Algunas acciones pueden pedir más: se confirma por acción vía API (#8).

