# ---------------------------------------------------------------- acciones (CFD)
# Las acciones no tienen spread de IG: pagan comisión al abrir y al cerrar (fuente ig-es-costes).
# Cada acción concreta se agrega cuando se arme la lista de seguimiento (spec §2).
# El margen del 20 % es el que muestra IG en sus ejemplos (Apple, Inditex...) y el mínimo regulatorio
# para acciones (5:1). Algunas acciones pueden pedir más: se confirma por acción vía API (#8).

