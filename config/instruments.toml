# Instrumentos y condiciones del broker (Issue #7, ADR 0002).
#
# Regla (CLAUDE.md §5b): NO se inventan parámetros del broker. Cada valor dice de dónde sale:
#   campo = { value = "...", source = "<clave de [sources]>" }
# Lo que todavía no está confirmado queda pendiente, con el motivo:
#   campo = { pending = "..." }
# Mientras quede un costo pendiente, el motor rechaza validar un backtest (spec §11).
# Números como texto decimal (nunca float).

# ---------------------------------------------------------------- fuentes
[sources.ig-es-indices]
reference = "https://www.ig.com/es/indices"
consulted = "2026-11-20"
note = "Tablas 'Margen cliente minorista' y 'Spread mín. para OTC' (CFD al contado)."

[sources.ig-es-margenes]
reference = "https://www.ig.com/es/margenes"
consulted = "2026-11-20"
note = "Márgenes de franja 1, clientes minoristas (índices y acciones)."

[sources.ig-es-costes]
reference = "https://www.ig.com/es/nuestros-costes"
consulted = "2026-11-20"
note = "Spreads de CFD al contado, comisiones de acciones y fórmula de financiación nocturna."

[sources.ig-demo-api]
reference = "API REST de IG, cuenta demo: GET /markets/{epic} v3 (https://labs.ig.com/reference/markets-epic.html)"
consulted = "2026-11-20"
note = "CFD al contado de 1 € por punto (epics IX.D.*.IFE.IP), variante elegida por el grupo en #67. valueOfOnePip, dealingRules.minDealSize y tick = 10^-snapshot.decimalPlacesFactor ('Number of decimal positions for market levels', con scalingFactor 1)."

[sources.ig-demo-spread]
reference = "docs/research/ig-spreads-2026-11.md (medido con GET /prices/{epic} v3 en la cuenta demo; cfds-ig, ejemplo ig_market_terms)"
consulted = "2026-11-20"
note = "Mediana de ask − bid al cierre de las velas de 1h enteras dentro de la sesión regular de la bolsa, del 2026-11-09 al 2026-11-20."

[sources.ecb-estr]
reference = "BCE, serie EST.B.EU000A2X2A25.WT 'Euro short-term rate' (https://data-api.ecb.europa.eu/service/data/EST/B.EU000A2X2A25.WT)"
consulted = "2026-11-20"
note = "Valor de referencia 19-11-2026, publicado el 20-11-2026 a las 08:00 CET. 'The ECB does not charge for the €STR or license its use' (https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/euro_short-term_rate/html/index.en.html)."

[sources.esma-2018-796]
reference = "Decisión (UE) 2018/796 de ESMA (medidas sobre CFD para clientes minoristas)"
consulted = "2026-11-20"
note = "Cierre de posiciones cuando el margen cae al 50 % del requerido. Mínimo regulatorio."

# ---------------------------------------------------------------- cuenta
[account]
broker = "IG Europe GmbH (sucursal en España, CNMV n.º 121)"
# Moneda de la cuenta demo (POST /session: currencyIsoCode). Los montos del backtest van en ella.
currency = { value = "EUR", source = "ig-demo-api" }
# Hora del cargo de financiación nocturna: 23:00 en horario centroeuropeo (CE(S)T).
funding_cutoff = { value = "23:00", source = "ig-es-costes" }
funding_cutoff_timezone = "Europe/Madrid"
margin_closeout_pct = { value = "50", source = "esma-2018-796" }

# ---------------------------------------------------------------- tipos de referencia
# Valor anual en % de cada tipo de referencia de la financiación nocturna (campo
# funding_benchmark de los instrumentos). El backtest lo usa constante en un recorrido: sirve para
# períodos cortos; un período largo necesita la serie diaria (pendiente).
[funding_benchmarks]
ESTR = { value = "2.441", source = "ecb-estr" }

# ---------------------------------------------------------------- índices
# Fórmula de financiación de IG para índices (fuente ig-es-costes):
#   noches × precio de cierre × tamaño × (tipo de referencia ± tasa administrativa) / divisor
# Largos pagan (referencia + tasa); cortos reciben (referencia − tasa).
# Los CFD de índices no tienen comisión: el costo es el spread (fuente ig-es-costes).
#
# Spread típico (#67): el MAYOR entre el medido en la demo en sesión regular (ig-demo-spread) y el
# mínimo publicado para la cuenta real (ig-es-indices), para no subestimar costos si la demo tiene
# spreads más finos. Decisión de Alexei en #67. Tabla por franja horaria en la fuente ig-demo-spread.

[instruments.US100]
name = "EEUU Tech 100"
asset_class = "index"
currency = "EUR"   # contrato de 1 € por punto (#67); el índice cotiza en puntos
exchange = "XNYS"
exchange_timezone = "America/New_York"
max_leverage = "10"   # tope propio (spec §8), por debajo del máximo regulatorio
epic = { value = "IX.D.NASDAQ.IFE.IP", source = "ig-demo-api" }
margin_retail_pct = { value = "5", source = "ig-es-indices" }
spread_min_points = { value = "1.6", source = "ig-es-indices" }
spread_typical_points = { value = "1.6", source = "ig-es-indices" }
value_per_point = { value = "1", source = "ig-demo-api" }
min_deal_size = { value = "0.5", source = "ig-demo-api" }
tick = { value = "0.1", source = "ig-demo-api" }
funding_admin_fee_pct = { value = "2.5", source = "ig-es-costes" }
funding_day_count = { value = "360", source = "ig-es-costes" }
funding_benchmark = { pending = "Contrato en EUR (#67): probablemente ESTR como el DE40, pero ni la API ni ig.com/es lo confirman para este índice. Confirmar con IG." }

