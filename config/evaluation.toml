# Evaluación de la Fase 5 (ROADMAP, #298): walk-forward, comprar y mantener por ventana y el
# tramo fuera de muestra aparte. Las ventanas de entrenamiento y prueba
# y el fuera de muestra salen de config/data_split.toml.

[walk_forward]
# Días corridos de velas anteriores a cada tramo que se recorren solo para calentar los
# indicadores (spec: 200 velas de 15m y 60 de 1h como mínimo). En ellos no se abre nada.
warmup_days = 30

# Sensibilidad (#298): cada parámetro se varía SOLO, con el resto en su valor de config, y SOLO
# con el entrenamiento de cada ventana (la prueba y el fuera de muestra nunca participan). Mide qué
# tan estables son las métricas alrededor de los valores de config; NO elige un "mejor" conjunto ni
# cambia la estrategia (eso lo decide el dueño). Archivos permitidos: strategy.toml, backtest.toml
# y risk.toml. Cada clave tiene que existir y cada valor ser del mismo tipo que en su archivo.

[[sensitivity]]
file = "strategy.toml"
key = "score.min_score"
values = [4, 5, 6]

[[sensitivity]]
file = "strategy.toml"
key = "stop.atr_buffer"
values = ["0.25", "0.5", "0.75"]

[[sensitivity]]
file = "backtest.toml"
key = "exits.tp1_r"
values = ["1.5", "2", "2.5"]

[[sensitivity]]
file = "backtest.toml"
key = "exits.trailing_atr"
values = ["1.5", "2", "2.5"]

[[sensitivity]]
file = "risk.toml"
key = "stop_distance.max_atr"
values = ["2.5", "3", "3.5"]
