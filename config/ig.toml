# Conexión con la API REST de IG (#66, ADR 0002).
#
# Regla (CLAUDE.md §5): solo la cuenta DEMO. Este proveedor solo LEE datos: no tiene endpoints
# de órdenes. Pasar a la cuenta real requiere un ADR aprobado por las dos personas, y el motor
# rechaza cualquier otro entorno o URL al arrancar.
#
# Las credenciales NO van acá: IG_USERNAME, IG_PASSWORD y (opcional) IG_API_KEY son variables
# de entorno (.env.example). En las sesiones cloud, el proxy inyecta la clave de la API.

[api]
environment = "demo"
base_url = "https://demo-api.ig.com/gateway/deal"
request_timeout_secs = 30

# Límites de uso publicados por IG: https://labs.ig.com/faq.html (sección "Limits"),
# consultado el 2026-11-20. "Unfortunately, at the moment there is no possibility to increase the limits."
[limits]
# "Per-account non-trading requests per minute: 30" (el límite por app es 60: manda el menor).
non_trading_requests_per_minute = 30
# "Historical price data points per week: 10,000 (Applies to price history endpoints)".
historical_points_per_week = 10000

# Reintentos ante errores de red, 5xx y límites por minuto (403 exceeded-account-allowance /
# exceeded-api-key-allowance). Espera = min(inicial × 2^(intento-1), máximo).
# El límite SEMANAL de históricos nunca se reintenta.
[retry]
max_attempts = 4
initial_backoff_secs = 2
max_backoff_secs = 60

[history]
# Puntos por página de GET /prices/{epic} (v3, parámetro pageSize).
page_size = 500
# IG interpreta `from`/`to` en la hora local de la cuenta (medido en la demo el 2026-11-20) y no
# en UTC. Se convierte con el `timezoneOffset` de la sesión y se pide este margen de más a cada
# lado, por si el rango cruza un cambio de horario. Después se filtra el rango exacto en UTC.
# Cuesta puntos del cupo semanal: 4 por lado en 15m, 1 por lado en 1h.
local_time_margin_hours = 1
# Zona de la cuenta de IG: las velas diarias (resolution=DAY) van de medianoche a medianoche en
# esta zona (#103). Medido en la demo el 2026-11-21: la vela empieza a las 23:00 UTC en
# noviembre y a las 22:00 UTC en julio (UTC+1 / UTC+2, Europa central). IG solo da el desfase
# (`timezoneOffset`), no el nombre: cualquier zona de Europa central tiene las mismas reglas.
# Cada vela diaria se controla contra esta zona: si no coincide, la carga falla.
prices_timezone = "Europe/Madrid"
# Demora máxima del inicio de la vela diaria después de la medianoche local. Medido: en la semana
# siguiente al cambio de horario de marzo de 2022, IG siguió empezando a las 23:00 UTC (01:00
# local) hasta el 2022-04-04. El cierre se toma como máx(medianoche siguiente, inicio + 24 h).
daily_start_tolerance_minutes = 60

# Modo en vivo (#68): cada vela se pide por REST apenas cierra, en modo exacto (1 punto por vela).
# La Streaming API (Lightstreamer) no está disponible: la cuenta demo responde "Insufficient
# permissions" a las suscripciones CHART (medido el 2026-11-20). Ver #68.
[live]
# Timeframes que se mantienen al día.
timeframes = ["15m", "1h"]
# Espera después del cierre de la vela antes de pedirla, para que IG la tenga consolidada.
candle_delay_secs = 20
# Si una vela cerrada sigue sin llegar (o no valida) pasado este tiempo, kill switch (CLAUDE.md §5b).
give_up_after_secs = 600
# Al arrancar sin datos previos, cuánto hacia atrás se completa.
startup_lookback_hours = 24

# Sentimiento de clientes de IG (#27): % de clientes con posición larga, un pedido para todos los
# instrumentos del catálogo (GET /clientsentiment). No gasta cupo de históricos.
[sentiment]
# Cada cuántos minutos se graba, alineado a la hora (15 → :00, :15, :30, :45). 96 pedidos por día.
interval_minutes = 15

# Antes de una carga histórica (ig_backfill, ig_backfill_daily), #143. Los puntos se estiman con
# el plan de huecos (#137) y el margen de cada pedido; `--dry-run` los muestra sin conectarse.
[loads]
# Arriba de esto se pide confirmación en la terminal, salvo `--yes`. Sin terminal (cron), se niega.
confirm_above_points = 500
# Tope de una carga en una máquina que no tiene CFDS_DATA_MACHINE=1 en su .env (solo el Mac mini
# lo tiene, docs/guides/trabajo-en-paralelo.md). `--yes` no lo saltea.
max_points_off_data_machine = 100
