name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  engine-integration:
    name: engine (integración PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: cfds
          # Contraseña descartable, solo para este contenedor efímero de CI. No es un secreto.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cfdstrader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfds -d cfdstrader_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cfds:ci-only@127.0.0.1:5432/cfdstrader_test
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Los tests que necesitan servicios están marcados #[ignore]; acá se corren todos.
      - run: cargo test --workspace --locked -- --ignored
      # Los tests de Python que escriben en PostgreSQL (noticias, #111) usan la base que las
      # migraciones del motor ya dejaron lista en el paso anterior.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tests de integración de Python
        working-directory: intelligence
        run: |
          uv sync --locked
          uv run pytest tests/test_news_store.py tests/test_cot_store.py \
            tests/test_news_interpretations_store.py tests/test_ml_dataset_store.py \
            tests/test_ml_experiment_store.py tests/test_sentiment_index_store.py \
            tests/test_analogs_store.py tests/test_phase4b_store.py \
            tests/test_calendar_store.py

  intelligence:
    name: intelligence (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  ui:
    name: ui (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
