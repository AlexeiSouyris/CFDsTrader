name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# En un PR, un push nuevo cancela la corrida vieja (ya no sirve). En main nunca se cancela:
# cada merge tiene que quedar verificado, si no, una rotura de main pasa sin verse (#584).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Qué partes del repo cambió el PR. En main se corre todo.
  changes:
    name: cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ github.event_name == 'push' || steps.filter.outputs.engine == 'true' }}
      intelligence: ${{ github.event_name == 'push' || steps.filter.outputs.intelligence == 'true' }}
      ui: ${{ github.event_name == 'push' || steps.filter.outputs.ui == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - 'contracts/**'
              - 'config/**'
              - 'infra/**'
              - '.github/workflows/**'
            engine:
              - *shared
              - 'engine/**'
            intelligence:
              - *shared
              - 'intelligence/**'
            ui:
              - *shared
              - 'ui/**'

  engine:
    name: engine (Rust)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # Un solo cache compartido que se guarda solo desde main: los PRs lo leen y no lo pisan,
      # así no se llena el límite de caches con una copia por rama (#584).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  engine-integration:
    name: engine (integración PostgreSQL + Redis)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.intelligence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: cfds
          # Contraseña descartable, solo para este contenedor efímero de CI. No es un secreto.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cfds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfds -d cfds_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cfds:ci-only@127.0.0.1:5432/cfds_test
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: engine-integration
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Los tests que necesitan servicios están marcados #[ignore]; acá se corren todos.
      - run: cargo test --workspace --locked -- --ignored
      # Los tests de Python que escriben en PostgreSQL (marca `pg`) usan la base que las
      # migraciones del motor ya dejaron lista en el paso anterior.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tests de integración de Python
        working-directory: intelligence
        run: |
          uv sync --locked
          # Todos los tests marcados `pg` (escriben en PostgreSQL; guardia en tests/conftest.py,
          # #376). Así no hay que listar a mano cada archivo nuevo (#385).
          uv run pytest -m pg

  intelligence:
    name: intelligence (Python)
    needs: changes
    if: needs.changes.outputs.intelligence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  ui:
    name: ui (TypeScript)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Pruebas en navegador real (#661): humo de cada vista (consola, 375 px, axe) y capturas de
  # referencia. Corre dentro de la imagen oficial de Playwright: Chromium y sus dependencias ya
  # vienen en la imagen (no se descargan) y las capturas salen siempre con las mismas fuentes de
  # Linux. La versión de la imagen tiene que ser la de @playwright/test en ui/package.json.
  ui-e2e:
    name: ui (e2e Playwright)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: La imagen coincide con @playwright/test
        run: |
          want=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          test "$want" = "1.65.1" || { echo "actualizá la imagen de ui-e2e a v$want"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: npm-e2e-
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e
      # Si algo falló, se generan las capturas de Linux para revisarlas y, si el cambio era
      # buscado, copiarlas a ui/e2e/__screenshots__ (docs/guides/pruebas-e2e-ui.md).
      - name: Capturas nuevas (solo si falló)
        if: failure()
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=all --reporter=list --output=/tmp/pw-update || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-capturas-linux
          path: |
            ui/e2e/__screenshots__/
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  # Las tablas generadas (registro de módulos y índice de contratos) tienen que estar al día (#669).
  docs:
    name: docs (tablas generadas)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/docs_index.py --check

  # Aviso (no bloquea) si el PR pasa las 400 líneas de CLAUDE.md §2 sin contar tests, fixtures,
  # lockfiles, datos ni docs/modules (#669). No entra en `CI ok`.
  pr-size:
    name: tamaño del PR (aviso)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/pr_size.py "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # El N del Sharpe deflactado (`dsr_trials` de config/research.toml) tiene que cubrir todas las
  # pruebas del registro de resultados (#660). Corre siempre: tarda segundos.
  registro:
    name: registro (dsr_trials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/research/check_dsr_trials.py
      - run: python -m unittest discover -s tools/research

  # Un solo resultado para decidir el merge: falla si algún job falló o se canceló, y pasa si
  # los que no hacían falta quedaron salteados (#584).
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, engine, engine-integration, intelligence, ui, ui-e2e, docs, registro]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "un job terminó en: $r"; exit 1 ;;
            esac
          done
