[package]
name = "cfds-fund"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-core = { version = "0.1.0", path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "rust_decimal"] }
thiserror = "2.0.21"
toml = "0.9"

[dev-dependencies]
cfds-storage = { version = "0.1.0", path = "../storage" }
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
rust_decimal = { version = "1.43.0", features = ["macros"] }

[lints]
workspace = true
