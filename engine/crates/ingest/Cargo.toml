[package]
name = "cfds-ingest"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-core = { version = "0.1.0", path = "../core" }
cfds-indicators = { path = "../indicators" }
cfds-market-data = { version = "0.1.0", path = "../market-data" }
cfds-storage = { version = "0.1.0", path = "../storage" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
cfds-liquidity = { version = "0.1.0", path = "../liquidity" }
cfds-patterns = { version = "0.1.0", path = "../patterns" }
cfds-regime = { version = "0.1.0", path = "../regime" }
cfds-strategy = { version = "0.1.0", path = "../strategy" }
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "aio"] }
rust_decimal = { version = "1.43.0", features = ["macros"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
