[package]
name = "cfds-journal"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-backtest = { version = "0.1.0", path = "../backtest" }
cfds-core = { version = "0.1.0", path = "../core" }
cfds-strategy = { version = "0.1.0", path = "../strategy" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rust_decimal = { version = "1.43.0", features = ["maths"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "rust_decimal"] }
thiserror = "2.0.21"
toml = "0.9"

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
cfds-storage = { version = "0.1.0", path = "../storage" }
rust_decimal = { version = "1.43.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
