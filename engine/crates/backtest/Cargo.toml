[package]
name = "cfds-backtest"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
cfds-core = { version = "0.1.0", path = "../core" }
cfds-indicators = { version = "0.1.0", path = "../indicators" }
cfds-patterns = { version = "0.1.0", path = "../patterns" }
cfds-risk = { version = "0.1.0", path = "../risk" }
cfds-strategy = { version = "0.1.0", path = "../strategy" }
rust_decimal = { version = "1.43.0", features = ["macros", "maths"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
cfds-market-data = { version = "0.1.0", path = "../market-data" }

[lints]
workspace = true

[dev-dependencies]
# Solo para el ejemplo `backtest_run`, que guarda la corrida en el diario (#181). Cargo permite
# este ciclo en dev-dependencies: `cfds-journal` depende de la biblioteca de este crate.
cfds-journal = { version = "0.1.0", path = "../journal" }
cfds-liquidity = { version = "0.1.0", path = "../liquidity" }
cfds-storage = { path = "../storage" }
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
