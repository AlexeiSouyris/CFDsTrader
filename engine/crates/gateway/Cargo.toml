[package]
name = "cfds-gateway"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-backtest = { version = "0.1.0", path = "../backtest" }
cfds-broker = { version = "0.1.0", path = "../broker" }
cfds-core = { version = "0.1.0", path = "../core" }
cfds-fund = { version = "0.1.0", path = "../fund" }
cfds-journal = { version = "0.1.0", path = "../journal" }
cfds-liquidity = { version = "0.1.0", path = "../liquidity" }
cfds-market-data = { version = "0.1.0", path = "../market-data" }
cfds-obs = { version = "0.1.0", path = "../obs" }
cfds-risk = { version = "0.1.0", path = "../risk" }
cfds-storage = { version = "0.1.0", path = "../storage" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
chrono-tz = "0.10.4"
toml = "0.9"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
rust_decimal = { version = "1.43.0", features = ["macros"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }

[lints]
workspace = true
