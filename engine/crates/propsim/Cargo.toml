[package]
name = "cfds-propsim"
description = "Simulador de cuentas fondeadas (Academia, #802): reglas, recorrido determinista y Monte Carlo."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-backtest = { version = "0.1.0", path = "../backtest" }
cfds-core = { version = "0.1.0", path = "../core" }
cfds-indicators = { version = "0.1.0", path = "../indicators" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
rust_decimal = { version = "1.43.0", features = ["macros", "maths"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.9"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }

[lints]
workspace = true
