[package]
name = "cfds-storage"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-core = { version = "0.1.0", path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "aio"] }
rust_decimal = "1.43.0"
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "rust_decimal"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
