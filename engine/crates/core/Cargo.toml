[package]
name = "cfds-core"
description = "Tipos compartidos del motor (instrumentos, velas, dinero)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
rust_decimal = { version = "1.43.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1.0.154"
