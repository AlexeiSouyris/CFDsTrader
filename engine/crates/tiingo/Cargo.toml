[package]
name = "cfds-tiingo"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-core = { version = "0.1.0", path = "../core" }
cfds-ig = { version = "0.1.0", path = "../ig" }
cfds-storage = { version = "0.1.0", path = "../storage" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.21"
toml = "0.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
