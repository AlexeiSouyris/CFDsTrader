[package]
name = "cfds-ig"
description = "Proveedor de datos de IG (cuenta demo): sesión REST e histórico de velas (#66)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-core = { version = "0.1.0", path = "../core" }
cfds-market-data = { version = "0.1.0", path = "../market-data" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
toml = "0.9"

[lints]
workspace = true

[dev-dependencies]
cfds-ingest = { path = "../ingest" }
cfds-storage = { path = "../storage" }
rust_decimal = { version = "1.43.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
