[package]
name = "cfds-academy"
description = "Academia: catálogo, corrección de exámenes y progreso (#709)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "json"] }
thiserror = "2.0.21"
toml = "0.9"

[dev-dependencies]
cfds-storage = { version = "0.1.0", path = "../storage" }
jsonschema = { version = "0.61.2", default-features = false }
rust_decimal = { version = "1.43.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
