[package]
name = "cfds-academy"
description = "Academia: catálogo, corrección de exámenes y progreso (#709)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0.21"
toml = "0.9"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1.0.154"
rust_decimal = { version = "1.43.0", features = ["macros"] }

[lints]
workspace = true
