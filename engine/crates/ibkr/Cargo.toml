[package]
name = "cfds-ibkr"
description = "IBKR, cuenta paper, solo lectura: cuentas, resumen y velas cerradas de futuros micro (ADR 0017, #534)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfds-core = { version = "0.1.0", path = "../core" }
cfds-market-data = { version = "0.1.0", path = "../market-data" }
cfds-obs = { version = "0.1.0", path = "../obs" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# Crate de la comunidad (MIT), no oficial de IBKR. Versión exacta: revisar su código antes de subirla
# (ADR 0017 §3). Solo el cliente async; el módulo de órdenes no se usa en ningún lado (ver tests).
ibapi = { version = "=5.7.0", default-features = false, features = ["async"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }
toml = "0.9"

[dev-dependencies]
# Solo el ejemplo ibkr_load guarda en PostgreSQL; la biblioteca no depende de la base.
cfds-storage = { version = "0.1.0", path = "../storage" }
rust_decimal = { version = "1.43.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
