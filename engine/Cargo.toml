[workspace]
resolver = "3"
members = ["crates/backtest", "crates/broker", "crates/obs","crates/core", "crates/ig", "crates/indicators", "crates/ingest", "crates/fund", "crates/gateway", "crates/journal", "crates/liquidity", "crates/market-data", "crates/patterns", "crates/regime", "crates/risk", "crates/storage", "crates/strategy", "crates/tiingo"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# El dinero nunca se representa con float: ver CLAUDE.md §4.
float_arithmetic = "warn"
